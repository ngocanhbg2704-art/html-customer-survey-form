<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><title>Market Research Survey</title><style>body { font-family: "Lucida Grande", "Lucida Sans Unicode", Tahoma, sans-serif; background-color: #f0f4f7; padding: 20px; } .survey-container { background: #fff; padding: 30px; max-width: 650px; margin: 0 auto; border-radius: 6px; box-shadow: 0 0 10px rgba(0,0,0,0.1); } h2 { color: #333; margin-top: 0; border-bottom: 1px solid #ccc; padding-bottom: 10px; } p.desc { color: #666; font-size: 14px; margin-bottom: 20px; } .form-group { margin-bottom: 20px; } .form-group label { font-weight: bold; display: block; margin-bottom: 6px; } select, textarea, input[type="text"] { width: 100%%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; } table { width: 100%%; border-collapse: collapse; margin-top: 10px; } th, td { border: 1px solid #e0e0e0; padding: 8px; text-align: center; font-size: 13px; } th { background-color: #f8f9fa; } tr:nth-child(even) { background-color: #fafafa; } td:first-child { text-align: left; font-weight: normal; } input[type="submit"] { background-color: #4caf50; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; } input[type="submit"]:hover { background-color: #45a049; }</style></head><body><div class="survey-container"><h2>Market Research Survey</h2><p class="desc">Please take a few minutes to give us your feedback about our products and services.</p><form action="#" method="POST"><div class="form-group"><label>What is your age range?</label><select name="age"><option value="18-24">18-24</option><option value="25-34">25-34</option><option value="35-50">35-50</option><option value="50+">50+</option></select></div><div class="form-group"><label>What is your yearly income?</label><select name="income"><option value="under_25k">$0 - $25,000</option><option value="25k_50k">$25,001 - $50,000</option><option value="50k_100k">$50,001 - $100,000</option><option value="over_100k">$100,000+</option></select></div><div class="form-group"><label>Gender</label><div><label style="font-weight:normal; margin-right:15px;"><input type="radio" name="gender" value="Male" checked/> Male</label><label style="font-weight:normal;"><input type="radio" name="gender" value="Female"/> Female</label></div></div><div class="form-group"><label>How satisfied are you with our products and services?</label><table><tr><th></th><th>Very Unsatisfied</th><th>Unsatisfied</th><th>Neutral</th><th>Satisfied</th><th>Very Satisfied</th></tr><tr><td>Quality</td><td><input type="radio" name="quality" value="1"/></td><td><input type="radio" name="quality" value="2"/></td><td><input type="radio" name="quality" value="3" checked/></td><td><input type="radio" name="quality" value="4"/></td><td><input type="radio" name="quality" value="5"/></td></tr><tr><td>Price</td><td><input type="radio" name="price" value="1"/></td><td><input type="radio" name="price" value="2"/></td><td><input type="radio" name="price" value="3" checked/></td><td><input type="radio" name="price" value="4"/></td><td><input type="radio" name="price" value="5"/></td></tr><tr><td>Customer Service</td><td><input type="radio" name="service" value="1"/></td><td><input type="radio" name="service" value="2"/></td><td><input type="radio" name="service" value="3" checked/></td><td><input type="radio" name="service" value="4"/></td><td><input type="radio" name="service" value="5"/></td></tr></table></div><div class="form-group"><label>How likely are you to recommend us to a friend or colleague?</label><textarea name="comments" rows="4" placeholder="Type your response here..."></textarea></div><input type="submit" value="Submit Survey"/></form></div></body></html>
